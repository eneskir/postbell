name: Bug report
description: Something in Postbell does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, one per line, so someone else can repeat them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: A screenshot helps. Hide account names and files you don't want to share.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Postbell and Windows version
      placeholder: Postbell 0.1.3 on Windows 11
    validations:
      required: true
