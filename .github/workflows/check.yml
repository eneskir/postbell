name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. On main every commit gets its own group, because
# GitHub cancels a run still pending in a group when a newer one joins it.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    # Windows: the Rust shell uses Windows-only crates (WebView2, the registry), and
    # the license notices are generated from the packages installed on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Secret scan
        run: python tools/secret_scan.py

      - name: Secret scan and PR title tests
        run: python -m unittest discover -s tools

      - name: Install
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: npm run check
        working-directory: apps/desktop
        run: npm run check
