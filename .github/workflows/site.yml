name: Publish postbell.app

# The Pages project uses Direct Upload, so this workflow's scan runs before deploy (Pages' Git integration would skip it).
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"
      - "tools/secret_scan.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postbell-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Actions are pinned to a SHA: a tag can move, and this job holds the Cloudflare token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same scan as the Check job, run again here because this job holds the token.
      - name: Secret scan
        run: python3 tools/secret_scan.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site --project-name=postbell --branch=main

      - name: Summary
        if: always()
        run: |
          {
            echo '## postbell.app deploy'
            echo ''
            echo "commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
