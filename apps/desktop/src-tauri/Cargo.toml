[package]
name = "postbell"
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "postbell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
# Password vault: the clipboard with "exclude from history", and secrets zeroed when dropped.
keyring-core = "1.1.0"
arboard = { version = "3.7.0", default-features = false }
zeroize = "1.9.2"

# Same version Tauri already uses (Cargo.lock), so only API features are enabled.
[target.'cfg(windows)'.dependencies]
# Password vault: one Windows Credential Manager entry per account.
windows-native-keyring-store = "1.1.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }

[profile.dev]
debug = "line-tables-only"

# Size settings recommended by the Tauri docs.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
